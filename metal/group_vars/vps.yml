# TransIP VPS, see vps.yml. Overrides group_vars/all.yml.
ansible_user: jkoper
ansible_become: true

headscale_version: 0.29.7
headscale_domain: headscale.jonaskoperdraat.nl
# Headscale users; devices are registered per user (scripts/vpn-add-device)
headscale_users:
  - homelab
  - jonas
  - fenna
# Users who may also reach the cluster API and the nodes (SSH)
headscale_admins:
  - jonas

# What the homelab subnet router (system/apps/tailscale) advertises, from the
# inventory; routes are approved automatically and limited by the policy
# (roles/headscale/templates/policy.hujson.j2)
headscale_ingress: "{{ load_balancer_ip_pool }}"
headscale_kube_api: ["{{ control_plane_endpoint }}/32"]
headscale_nodes: "{{ groups['metal'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '$', '/32') | list }}"
headscale_router_routes: "{{ headscale_ingress + headscale_kube_api + headscale_nodes }}"

# SNI proxy (roles/sni_proxy): server name on port 443 -> backend.
# Public homelab apps get added here later.
sni_routes:
  - name: "{{ headscale_domain }}"
    backend: 127.0.0.1:8443
