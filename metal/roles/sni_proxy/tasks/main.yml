- name: Install nginx with the stream module
  ansible.builtin.apt:
    name:
      - nginx
      - libnginx-mod-stream

- name: Configure SNI proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx

- name: Start nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
