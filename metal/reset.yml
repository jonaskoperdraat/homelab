# Destroy the Kubernetes cluster on the nodes but keep the OS, so it can be
# recreated with `make cluster`. Removes k3s, all cluster data and the Ceph
# OSD partition contents (created by the kickstart in roles/pxe_server).
- name: Reset Kubernetes cluster
  hosts: metal
  vars_prompt:
    - name: confirm
      prompt: "This destroys the cluster and ALL its data (including Ceph) on every host in the inventory. Type 'reset' to continue"
      private: false
  tasks:
    - name: Require confirmation
      ansible.builtin.assert:
        that: confirm == 'reset'
        fail_msg: Aborted
      run_once: true

    # The kickstart (roles/pxe_server) creates it as an extra partition on the
    # OS disk. It is empty after a previous reset, so don't rely on its content:
    # take the one partition that is unmounted and has no filesystem other
    # than Ceph's. EFI and root are mounted and never match.
    - name: List partitions on the OS disk
      ansible.builtin.command: lsblk --json --paths --output NAME,TYPE,FSTYPE,MOUNTPOINT /dev/{{ disk }}
      register: lsblk
      changed_when: false
      check_mode: false

    - name: Select the Ceph partition
      ansible.builtin.set_fact:
        ceph_partition: >-
          {{ (lsblk.stdout | from_json).blockdevices[0].children | default([])
             | selectattr('type', 'equalto', 'part')
             | rejectattr('mountpoint')
             | selectattr('fstype', 'in', [none, 'ceph_bluestore'])
             | map(attribute='name') | list }}

    - name: Require exactly one Ceph partition
      ansible.builtin.assert:
        that: ceph_partition | length == 1
        fail_msg: "Expected one unmounted partition without filesystem (or with ceph_bluestore) on /dev/{{ disk }}, found: {{ ceph_partition }}"
        success_msg: "Ceph partition: {{ ceph_partition[0] }}"

    - name: Stop and disable k3s
      ansible.builtin.systemd:
        name: k3s
        state: stopped
        enabled: false
      failed_when: false

    # Clears container processes, mounts and Cilium's network devices and BPF state
    - name: Reboot
      ansible.builtin.reboot:

    # BlueStore (Ceph >= 19) keeps copies of its label at 1, 10, 100 and
    # 1000 GiB; with any left, Rook refuses the partition as belonging to
    # another Ceph cluster
    - name: Wipe the Ceph partition
      ansible.builtin.shell: |
        set -eu
        part={{ ceph_partition[0] }}
        size=$(blockdev --getsize64 "$part")
        wipefs --all "$part"
        dd if=/dev/zero of="$part" bs=1M count=100 oflag=direct,dsync
        for gib in 1 10 100 1000; do
          if [ $((gib * 1024 * 1024 * 1024)) -lt "$size" ]; then
            dd if=/dev/zero of="$part" bs=1M count=1 seek=$((gib * 1024)) oflag=direct,dsync
          fi
        done
      changed_when: true

    - name: Verify no BlueStore label is left
      ansible.builtin.shell: |
        set -eu
        part={{ ceph_partition[0] }}
        size=$(blockdev --getsize64 "$part")
        for gib in 0 1 10 100 1000; do
          if [ $((gib * 1024 * 1024 * 1024)) -lt "$size" ]; then
            if dd if="$part" bs=4096 count=1 skip=$((gib * 1024 * 256)) iflag=direct 2>/dev/null | grep -qa "bluestore block device"; then
              echo "BlueStore label left at ${gib} GiB" >&2
              exit 1
            fi
          fi
        done
      changed_when: false

    - name: Remove k3s, Kubernetes, CNI and Rook state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/k3s.service
        - /usr/local/bin/k3s
        - /etc/rancher
        - /var/lib/rancher
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/cni/net.d
        - /var/lib/rook

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
