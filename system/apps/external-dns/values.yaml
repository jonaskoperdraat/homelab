external-dns:
  provider:
    name: transip
  txtOwnerId: homelab
  domainFilters:
    - 127-0-0-1.nip.io
  annotationFilter: external-dns.alpha.kubernetes.io/exclude notin (true)
  env:
    - name: TRANSIP_ACCOUNT
      valueFrom:
        secretKeyRef:
          # Created by ../../external/modules/transip
          name: transip-credentials
          key: account-name
  extraArgs:
    - --transip-account=$(TRANSIP_ACCOUNT)
    - --transip-keyfile=/transip/private-key
  extraVolumes:
    - name: transip-credentials
      secret:
        secretName: transip-credentials
        items:
          - key: private-key
            path: private-key
  extraVolumeMounts:
    - name: transip-credentials
      mountPath: /transip
      readOnly: true
  interval: 5m
  triggerLoopOnEvent: true
  serviceMonitor:
    enabled: true
