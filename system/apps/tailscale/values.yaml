# Subnet router: makes the ingress reachable for devices in the tailnet, which
# is coordinated by Headscale on the VPS (metal/vps.yml). Registered by
# scripts/vpn-register-router (run by `make system`).
image: ghcr.io/tailscale/tailscale:v1.104.4
hostname: homelab
loginServer: https://headscale.jonaskoperdraat.nl
# Ingress (load_balancer_ip_pool), cluster API (control_plane_endpoint) and the
# nodes, as in metal/inventories/prod.yml. Headscale only approves what its
# policy (metal/group_vars/vps.yml) lists; scripts/vpn-register-router fails
# on anything unapproved.
routes: 192.168.88.224/27,192.168.88.50/32,192.168.88.41/32,192.168.88.42/32,192.168.88.43/32,192.168.88.44/32,192.168.88.45/32
