apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:
        webhook:
          groupName: {{ index .Values "cert-manager-webhook-transip" "groupName" }}
          solverName: transip
          config:
            accountName: {{ .Values.transip.accountName }}
            ttl: 300
            privateKeySecretRef:
              name: transip-credentials
              key: private-key
