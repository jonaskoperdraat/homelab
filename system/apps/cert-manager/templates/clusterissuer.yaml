{{- if eq (.Values.environment | default "prod") "dev" }}
# dev: Let's Encrypt can't issue for nip.io, so letsencrypt-prod is a local CA
# instead. Trust it with:
#   kubectl -n cert-manager get secret dev-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: homelab-dev CA
  secretName: dev-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  ca:
    secretName: dev-ca
{{- else }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:
        webhook:
          groupName: {{ index .Values "cert-manager-webhook-transip" "groupName" }}
          solverName: transip
          config:
            accountName: {{ .Values.transip.accountName }}
            ttl: 300
            privateKeySecretRef:
              name: transip-credentials
              key: private-key
{{- end }}
