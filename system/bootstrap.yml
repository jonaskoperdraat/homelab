- name: Bootstrapping the system layer of the cluster
  hosts: localhost
  vars:
    env: prod
    revision: master
  vars_files:
    - ../environments/{{ env }}.yml
  tasks:
    - name: Create ArgoCD namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: argocd
        state: present

    - name: Render ArgoCD System manifests from Helm chart
      kubernetes.core.helm_template:
        chart_ref: ./argocd
        include_crds: true
        release_name: argocd
        release_namespace: argocd
        dependency_update: true
        values_files: "{{ ['argocd/values.yaml'] + query('fileglob', 'argocd/values-' + env + '.yaml') }}"
        # Not a rewrite of the whole output: that would also rewrite the
        # domain the helm-env plugin script looks for
        set_values:
          - value: argo-cd.global.domain=argocd.{{ domain }}
      register: argocd_manifests

    - name: Apply ArgoCDSystem manifests
      kubernetes.core.k8s:
        resource_definition: "{{ argocd_manifests.stdout }}"
        apply: true
        server_side_apply:
          field_manager: argocd-controller
          force_conflicts: true

    - name: Wait for ArgoCD to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: argocd-server
        namespace: argocd
      register: argocd_deployment
      # Wait for the rollout, not just any ready (possibly old) replica
      until: >-
        argocd_deployment.resources[0].status.observedGeneration | default(0) >= argocd_deployment.resources[0].metadata.generation
        and argocd_deployment.resources[0].status.updatedReplicas | default(0) >= 1
        and argocd_deployment.resources[0].status.unavailableReplicas | default(0) == 0
      retries: 30
      delay: 10

    - name: Apply system ApplicationSet
      kubernetes.core.k8s:
        definition: "{{ lookup('template', 'argocd/applicationsets/system.yaml.j2') }}"
        state: present
        server_side_apply:
          field_manager: argocd-controller

    # Argo CD creates these namespaces when it syncs the apps; the Terraform
    # external layer (run next by the Makefile) writes secrets into them
    - name: Wait for the namespaces the external layer writes to
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ item }}"
      register: namespace
      until: namespace.resources | length > 0
      retries: 60
      delay: 10
      loop: "{{ ['system/apps/cert-manager', 'system/apps/external-dns'] | difference(excluded_apps) | map('basename') }}"
