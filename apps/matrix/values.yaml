elementweb:
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/target: "homelab-tunnel.jonaskoperdraat.nl"
      external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    hosts:
      - host: &frontend_host chat.jonaskoperdraat.nl
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: element-tls-certificate
        hosts:
          - *frontend_host
  config:
    default:
      base_url: https://matrix.jonaskoperdraat.nl
      server_name: jonaskoperdraat.nl

dendrite:
  dendrite_config:
    global:
      server_name: matrix.jonaskoperdraat.nl
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hostName: matrix.jonaskoperdraat.nl
    tls:
      - hosts:
          - matrix.jonaskoperdraat.nl
        secretName: matrix-tls-certificate
  postgresql:
    enabled: true
