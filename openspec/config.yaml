schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish
context: |
  Personal homelab, managed with GitOps (Argo CD follows the master branch).
  - master is production: every push to master deploys. Work happens on a
    feature branch, is tested on the dev cluster with `make env=dev switch`,
    and only then is merged into master. Tasks must include that dev test.
  - Fix things properly so a from-scratch build runs start to finish; no
    temporary workarounds or manual steps left behind.
  - Never commit environment differences into shared files: use
    environments/<env>.yml, values-<env>.yaml or templates gated on
    .Values.environment.
  - Never print, log or commit secret values. Read secret files only with
    tools that cannot echo values, and check the output format on dummy data
    first.
  - Scripts that change production (Headscale, the cluster, DNS) must abort
    when they cannot verify the current state, never treat an error as
    "nothing there".

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
