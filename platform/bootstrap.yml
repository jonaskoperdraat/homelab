- name: Bootstrapping the platform layer of the cluster
  hosts: localhost
  vars:
    env: prod
    revision: master
  vars_files:
    - ../environments/{{ env }}.yml
  tasks:
    - name: Wait for ArgoCD to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: argocd-server
        namespace: argocd
      register: argocd_deployment
      until: argocd_deployment.resources[0].status.readyReplicas | default(0) >= 1
      retries: 30
      delay: 10

    - name: Apply platform ApplicationSet
      kubernetes.core.k8s:
        definition: "{{ lookup('template', 'argocd/applicationsets/platform.yaml.j2') }}"
        state: present
        server_side_apply:
          field_manager: argocd-controller

    # Argo CD creates these namespaces when it syncs the apps; the Terraform
    # external layer (run next by the Makefile) writes secrets into them
    - name: Wait for the namespaces the external layer writes to
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ item }}"
      register: namespace
      until: namespace.resources | length > 0
      retries: 60
      delay: 10
      loop: "{{ ['system/apps/monitoring-system', 'platform/apps/global-secrets'] | difference(excluded_apps) | map('basename') }}"
