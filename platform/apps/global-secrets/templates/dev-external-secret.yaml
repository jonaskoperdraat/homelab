# dev: created by platform/external (Terraform) in production. Never run that
# against dev: its Terraform Cloud workspace is shared with production.
apiVersion: v1
kind: Secret
metadata:
  name: external
  namespace: {{ .Release.Namespace }}
stringData:
  # Placeholders, Gmail mail fetching in Paperless won't work on dev
  paperless-gmail-oauth-client-id: dev-placeholder.apps.googleusercontent.com
  paperless-gmail-oauth-client-secret: dev-placeholder
