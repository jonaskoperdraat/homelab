apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.dexLoginSource.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    template:
      engineVersion: v2
      data:
        # Client ID of the gitea static client in ../../dex/values.yaml
        key: gitea
        secret: {{` "{{ .client_secret }}" `}}
  data:
    - secretKey: client_secret
      remoteRef:
        key: dex.gitea
        property: client_secret
