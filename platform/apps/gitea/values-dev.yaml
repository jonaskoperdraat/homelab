# dev: trust the dev CA (ca.crt of our own ingress certificate)
gitea:
  deployment:
    env:
      - name: SSL_CERT_DIR
        value: /dev-ca
  extraVolumes:
    - name: dev-ca
      secret:
        secretName: gitea-tls-certificate
        items:
          - key: ca.crt
            path: ca.crt
  extraContainerVolumeMounts:
    - name: dev-ca
      mountPath: /dev-ca
