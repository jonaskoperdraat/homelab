app-template:
  controllers:
    main:
      type: statefulset
      containers:
        main:
          image:
            repository: docker.io/kanidm/server
            tag: 1.11.2
      statefulset:
        volumeClaimTemplates:
          - name: data
            size: 1Gi
            globalMounts:
              - path: /data
            accessMode: "ReadWriteOnce"
  configMaps:
    config:
      enabled: true
      data:
        server.toml: |
          version = "2"
          bindaddress = "[::]:443"
          ldapbindaddress = "[::]:636"
          db_path = "/data/kanidm.db"
          tls_chain = "/data/ca.crt"
          tls_key = "/data/tls.key"
          domain = "auth.127-0-0-1.nip.io"
          origin = "https://auth.127-0-0-1.nip.io"
          migration_path = "/data/migrations.d"

          [http_client_address_info]
          # k3s pod CIDR (ingress-nginx)
          x-forward-for = ["10.42.0.0/16"]
    migrations:
      enabled: true
      data:
        # https://kanidm.github.io/kanidm/stable/entry_management.html
        # Secrets can't be set by migrations, the OAuth2 client secret is
        # exported to global-secrets by templates/oauth2-secret-export.yaml
        10-homelab.hjson: |
          {
            "id": "b7f63a6b-a0bd-4915-9609-51a1b1a96574",
            "assertions": [
              {
                "state": "present",
                "id": "1e40a0a3-d0d5-4686-9a8c-c7f405143a0a",
                "class": ["group"],
                "name": "editor"
              },
              {
                "state": "present",
                "id": "ec2c7909-0310-4382-85c4-500172cdf281",
                "class": ["account", "oauth2_resource_server", "oauth2_resource_server_basic"],
                "name": "dex",
                "displayname": "Dex",
                "oauth2_rs_origin_landing": "https://dex.127-0-0-1.nip.io/",
                "oauth2_rs_origin": ["https://dex.127-0-0-1.nip.io/callback"],
                "oauth2_rs_scope_map": [
                  {
                    "group": "editor",
                    "scopes": ["openid", "profile", "email", "groups"]
                  }
                ]
              }
            ]
          }
  service:
    main:
      ports:
        http:
          enabled: false
        https:
          port: 443
          protocol: HTTPS
        ldap:
          port: 636
          protocol: TCP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      hosts:
        - host: &host auth.127-0-0-1.nip.io
          paths:
            - path: /
              pathType: Prefix
              service:
                name: main
                port: https
      tls:
        - hosts:
            - *host
          secretName: kanidm-tls-certificate
  persistence:
    config:
      enabled: true
      type: configMap
      name: kanidm-config
      globalMounts:
        - path: /data/server.toml
          subPath: server.toml
    migrations:
      enabled: true
      type: configMap
      name: kanidm-migrations
      globalMounts:
        - path: /data/migrations.d
    tls:
      enabled: true
      type: secret
      name: kanidm-selfsigned-certificate
      globalMounts:
        - path: /data/ca.crt
          subPath: ca.crt
        - path: /data/tls.key
          subPath: tls.key

oauth2SecretExport:
  kubectlImage: docker.io/alpine/k8s:1.36.5
