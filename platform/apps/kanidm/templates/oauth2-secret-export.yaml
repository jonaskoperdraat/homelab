# Kanidm generates OAuth2 client secrets itself (migrations can't set them),
# so copy the Dex client secret to global-secrets after each sync.
# Skipped when kanidm.dex already exists; delete it to force a re-export.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-secret-export
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-secret-export
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["kanidm-0"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["kanidm-0"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-secret-export
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-secret-export
subjects:
  - kind: ServiceAccount
    name: oauth2-secret-export
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kanidm-oauth2-secret-export
  namespace: global-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kanidm-oauth2-secret-export
  namespace: global-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kanidm-oauth2-secret-export
subjects:
  - kind: ServiceAccount
    name: oauth2-secret-export
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth2-secret-export
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: oauth2-secret-export
      restartPolicy: Never
      initContainers:
        - name: recover-idm-admin
          image: {{ .Values.oauth2SecretExport.kubectlImage }}
          command:
            - sh
            - -euc
            - |
              if kubectl -n global-secrets get secret kanidm.dex >/dev/null 2>&1; then
                echo "kanidm.dex already exists, skipping"
                touch /work/skip
                exit 0
              fi
              for i in $(seq 30); do
                out=$(kubectl -n {{ .Release.Namespace }} exec kanidm-0 -- kanidmd scripting recover-account idm_admin | tail -n1) || true
                if echo "$out" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                  echo "$out" | jq -r .output > /work/password
                  exit 0
                fi
                sleep 10
              done
              echo "Unable to recover idm_admin" >&2
              exit 1
          volumeMounts:
            - name: work
              mountPath: /work
        - name: read-client-secret
          image: docker.io/kanidm/tools:{{ (index .Values "app-template").controllers.main.containers.main.image.tag }}
          command:
            - sh
            - -euc
            - |
              [ -f /work/skip ] && exit 0
              export KANIDM_PASSWORD="$(cat /work/password)"
              kanidm login
              for i in $(seq 30); do
                secret=$(kanidm system oauth2 show-basic-secret dex -o text) || true
                if [ -n "$secret" ] && [ "$secret" != "No secret configured" ]; then
                  printf '%s' "$secret" > /work/client_secret
                  exit 0
                fi
                sleep 10
              done
              echo "Unable to read the dex client secret" >&2
              exit 1
          env:
            - name: KANIDM_URL
              value: https://kanidm.{{ .Release.Namespace }}.svc.cluster.local
            - name: KANIDM_NAME
              value: idm_admin
            - name: KANIDM_CA_PATH
              value: /ca/ca.crt
            # The self-signed certificate is issued for home.arpa
            - name: KANIDM_SKIP_HOSTNAME_VERIFICATION
              value: "true"
            - name: KANIDM_TOKEN_CACHE_PATH
              value: /work/tokens
          volumeMounts:
            - name: work
              mountPath: /work
            - name: ca
              mountPath: /ca
      containers:
        - name: store-client-secret
          image: {{ .Values.oauth2SecretExport.kubectlImage }}
          command:
            - sh
            - -euc
            - |
              [ -f /work/skip ] && exit 0
              kubectl -n global-secrets create secret generic kanidm.dex \
                --from-literal=client_id=dex \
                --from-file=client_secret=/work/client_secret \
                --dry-run=client -o yaml | kubectl apply -f -
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            medium: Memory
        - name: ca
          secret:
            secretName: kanidm-selfsigned-certificate
            items:
              - key: ca.crt
                path: ca.crt
